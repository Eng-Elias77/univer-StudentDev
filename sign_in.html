<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav-links">
        <ul>
            <li class="nav1-link"><a href="index.html">Home</a></li>
            <li class="nav2-link"><a href="about.html">About Us</a></li>

            <li class="nav5-link"><a href="sign_in.html">Sign Up</a></li>
        </ul>
    </nav>
    <form action="">
        <h2 style="text-align: center; margin-bottom: 10px;">Sign Up</h2>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
