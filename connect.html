<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav-links">
        <ul>
            <li class="nav1-link"><a href="index.html">Home</a></li>
            <li class="nav2-link"><a href="about.html">About Us</a></li>
            <li class="nav3-link"><a href="connect.html">Contact</a></li>

            <li class="nav5-link"><a href="sign_in.html">Sign Up</a></li>
        </ul>
    </nav>
    <form action="">
        <h2 style="text-align: center; margin-bottom: 10px;">Contact Us</h2>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; resize: vertical;" required></textarea>
        <button type="submit">Send Message</button>
    </form>
</body>
</html>
